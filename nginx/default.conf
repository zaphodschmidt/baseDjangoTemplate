# The production edge. One origin serves the built frontend and the API, which
# is what makes the whole stack same-origin: no CORS configuration exists
# anywhere, because nothing is ever cross-origin.

# The backend is named ONCE, in a variable, and `resolver` is set. Without
# both, nginx resolves a container hostname a single time at config-parse time
# and caches the address for the life of the process — so a `compose up --build`
# that recreates the backend hands it a new address on the compose network and
# nginx keeps dialling the dead one. Every request 502s while `compose ps` shows
# every service running. Docker's embedded DNS lives at 127.0.0.11.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Security headers at the edge, so they cover static assets too and are not
    # per-view configuration anyone can forget.
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-Frame-Options           "DENY"         always;
    add_header Referrer-Policy           "same-origin"  always;
    # HSTS belongs here, but only once this hostname is genuinely HTTPS-only —
    # a max-age you did not mean is not something you can take back from a
    # browser that already cached it. Uncomment when you terminate TLS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;   # matches DATA_UPLOAD_MAX_MEMORY_SIZE

    # ── API, admin, schema → Django ────────────────────────────────────────
    location ~ ^/(api|admin|static)/ {
        set $upstream http://backend:8000;
        # $request_uri is spelled out. `proxy_pass $var;` with no URI part
        # relies on a subtle rule about when nginx forwards the original URI,
        # and getting it wrong 404s every API call. Being explicit costs
        # nothing and cannot be misread.
        proxy_pass $upstream$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this. It must be set by the edge and
        # never passed through from the client, or a request can claim to be
        # HTTPS when it is not.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ── Everything else → the built SPA ───────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be, or a
    # deploy ships new assets that no browser asks for.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
